name: Commit audited Composer lock

on:
  push:
    branches:
      - fix/payment-ledger-test-coverage
    paths:
      - composer.json
      - .github/workflows/commit-composer-lock.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payment-ledger-test-coverage

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3

      - name: Resolve and audit the supported dependency graph
        run: |
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
          composer audit --locked --no-interaction

      - name: Commit composer.lock
        shell: bash
        run: |
          if git diff --quiet -- composer.lock && git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            echo 'composer.lock is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'build: lock the audited Laravel 12 dependency graph'
          git push origin HEAD:fix/payment-ledger-test-coverage
