name: Boldinone quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      STRIPE_KEY: pk_test_portfolio_only
      STRIPE_SECRET: sk_test_portfolio_only
      STRIPE_WEBHOOK_SECRET: whsec_portfolio_only
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock --no-check-publish

      - name: Resolve supported dependencies
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress 2>&1 \
            | tee build/composer-${{ matrix.php }}.log

      - name: Audit resolved dependencies
        run: composer audit --locked --no-interaction

      - name: Verify a clean database migration
        run: php artisan migrate:fresh --force --no-interaction

      - name: Lint PHP source
        run: composer lint

      - name: Run PHPUnit
        run: |
          vendor/bin/phpunit \
            --configuration phpunit.xml \
            --testdox \
            --log-junit build/junit-${{ matrix.php }}.xml

      - name: Check tracked files for obvious live secrets
        shell: bash
        run: |
          if git grep -nE \
            'sk_live_[A-Za-z0-9]+|whsec_[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            -- ':!package-lock.json'; then
            echo 'Potential live credential or private key found in tracked files.'
            exit 1
          fi
          echo 'No obvious live credential patterns found.'

      - name: Upload Composer resolver log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boldinone-composer-php-${{ matrix.php }}
          path: build/composer-${{ matrix.php }}.log
          if-no-files-found: ignore

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boldinone-junit-php-${{ matrix.php }}
          path: build/junit-${{ matrix.php }}.xml
          if-no-files-found: ignore

      - name: Upload resolved lock file
        if: always() && matrix.php == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: boldinone-composer-lock
          path: composer.lock
          if-no-files-found: ignore
